<style>
html,body{margin:0;height:100%;background:#07061a;color:#e9e6ff;font-family:"PingFang SC","Microsoft YaHei",serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 62% 28%,rgba(76,52,190,.28),transparent 60%),radial-gradient(ellipse at 25% 72%,rgba(56,40,160,.2),transparent 55%),linear-gradient(#08071d,#0d0a2c)}
.box{width:min(300px,82vw);text-align:center;transition:opacity .6s}
.t{font-size:13px;letter-spacing:.6em;padding-left:.6em;opacity:.6;margin-bottom:30px}
.lock{font-size:26px;margin-bottom:10px;opacity:.9}

button{margin-top:16px;width:100%;padding:12px;border-radius:999px;border:1px solid rgba(255,214,150,.5);background:linear-gradient(180deg,rgba(60,44,110,.6),rgba(24,18,60,.6));color:#ffe9c8;font-size:15px;letter-spacing:.4em;cursor:pointer}
button:disabled{opacity:.5}
.err{height:20px;margin-top:14px;font-size:13px;color:#ffb3c8;letter-spacing:.1em}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
